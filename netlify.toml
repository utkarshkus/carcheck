[build]
  publish = "public"
  functions = "netlify/functions"
  command = "node tools/validate.mjs"

# The chat function reads manual digests at runtime. They live outside /public
# on purpose: the site never serves raw manual text to the browser.
[functions]
  node_bundler = "esbuild"
  included_files = ["digests/**", "public/data/cars/**"]

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/c/:carId"
  to = "/car.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'"
